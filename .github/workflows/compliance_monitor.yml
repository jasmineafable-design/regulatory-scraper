name: Regulatory Intelligence Compliance Monitor

on:
  schedule:
    # This is a wake-up *ceiling*, not the real schedule. GitHub Actions'
    # `schedule:` trigger is evaluated entirely by GitHub's own infrastructure
    # before any of this repo's code runs, so it can never itself read the
    # Sheet-configured business-day calendar / opening time / polling
    # interval (Foundation §3.2) -- that's an inherent platform limit, not a
    # gap in this workflow. Instead: wake up every 15 minutes across a wide
    # window (9:00 AM-6:45 PM Philippine Time / 01:00-10:45 UTC, Mon-Fri) that
    # comfortably covers any sensible Sheet configuration, and let
    # core.schedule.resolve_run_decision() (called from main.py) decide
    # whether this particular wake-up should actually run a check, and
    # whether it's the opening check. Most wake-ups outside the
    # Sheet-configured window/interval are expected no-ops (see main.py).
    - cron: '0,15,30,45 1-10 * * 1-5'

  workflow_dispatch:
    inputs:
      force_opening_run:
        description: 'Force this manual run to be treated as the opening run'
        type: boolean
        default: false

jobs:
  run-compliance-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistence state
        uses: actions/cache/restore@v4
        with:
          path: state/seen_issuances.json
          key: regulatory-state-${{ github.run_id }}
          restore-keys: |
            regulatory-state-

      - name: Execute Compliance Monitor
        env:
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          NOTIFICATION_RECIPIENTS: ${{ secrets.NOTIFICATION_RECIPIENTS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SCRAPER_PROXY_API_KEY: ${{ secrets.SCRAPER_PROXY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # main.py itself decides -- via core/schedule.py, against the
          # Sheet-configured business days/opening time/polling interval and
          # the last-run state -- whether this wake-up should run a check at
          # all, and whether it's the opening check. That decision no longer
          # depends on wall-clock/cron-identity comparisons here, so it isn't
          # thrown off by scheduling delay (Foundation §3.3). force_opening_run
          # is a manual override for workflow_dispatch only.
          if [ "${{ github.event.inputs.force_opening_run }}" = "true" ]; then
            echo "Manual override: forcing opening-run treatment..."
            python main.py --opening-run
          else
            python main.py
          fi

      - name: Save updated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/seen_issuances.json
          key: regulatory-state-${{ github.run_id }}
