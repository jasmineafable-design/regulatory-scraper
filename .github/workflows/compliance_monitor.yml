name: Regulatory Intelligence Compliance Monitor

on:
  schedule:
    # 1. Opening Run: 10:00 AM PST (02:00 UTC) Mon-Fri
    - cron: '0 2 * * 1-5'
    
    # 2. Intra-day Polling Runs: Every 30 mins from 10:30 AM to 5:00 PM PST (02:30-09:00 UTC) Mon-Fri
    - cron: '30 2 * * 1-5'
    - cron: '0,30 3-8 * * 1-5'
    - cron: '0 9 * * 1-5'

  workflow_dispatch:
    inputs:
      force_opening_report:
        description: 'Force Daily Monitoring Report if no items found'
        type: boolean
        default: false

jobs:
  run-compliance-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistence state
        uses: actions/cache@v4
        with:
          path: state/seen_issuances.json
          key: regulatory-state-${{ github.run_id }}
          restore-keys: |
            regulatory-state-

      - name: Execute Compliance Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CRON_HOUR=$(date -u +%H)
          CRON_MIN=$(date -u +%M)
          
          if [ "$CRON_HOUR" = "02" ] && [ "$CRON_MIN" = "00" ] || [ "${{ github.event.inputs.force_opening_report }}" = "true" ]; then
            echo "Executing Opening Run..."
            python main.py --is-opening-run
          else
            echo "Executing Intra-day Polling Run..."
            python main.py
          fi

      - name: Save updated state
        if: always()
        uses: actions/cache@v4
        with:
          path: state/seen_issuances.json
          key: regulatory-state-${{ github.run_id }}
