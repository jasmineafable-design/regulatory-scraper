name: Regulatory Scraper Pipeline

on:
  workflow_dispatch:  # Allows manual execution triggers from GitHub UI
  schedule:
    # Runs at 00:00 UTC (8:00 AM Manila Time) every day
    - cron: '0 0 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scaffolding Tests
        run: |
          pytest

      - name: Execute System Scaffolding Entrypoint
        run: |
          python main.py
