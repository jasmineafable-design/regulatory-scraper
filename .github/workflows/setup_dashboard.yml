# Manual, on-demand: (re)builds the "Dashboard" tab in the configuration
# Google Sheet (five oversight cards + Action Required table + scraper line)
# and upgrades the "Briefings" tab to the current layout (header row, the
# team's six columns and their dropdowns -- data rows are never touched).
# Re-running deletes and recreates ONLY the Dashboard tab.
#
# demo = add: also appends 7 sample rows (Regulator "DEMO") so you can check
# the layout; demo = remove deletes them again.
#
# Needs the service account to have EDITOR access to the Sheet.
# Costs nothing: no scraping, no proxy, no AI calls.

name: Setup Dashboard Tab

on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Sample rows for checking the layout (they are marked DEMO)'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'add'
          - 'remove'

jobs:
  setup-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Dashboard tab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ARCHIVE_FOLDER_URL: ${{ secrets.ARCHIVE_FOLDER_URL }}
        run: python tools/setup_dashboard.py --demo ${{ inputs.demo || 'none' }}
